services:
  postgres:
    image: postgres:17
    command:
      - "postgres"
      - "-c"
      - "config_file=/etc/postgresql/postgresql.conf"
    environment:
      - PGDATA=/var/lib/postgresql/data/pgdata/
      - POSTGRES_HOST_AUTH_METHOD=trust
      - POSTGRES_USER=pg
      - POSTGRES_PASSWORD=pwd
      - POSTGRES_DB=db
    volumes:
      - postgres:/var/lib/postgresql/data/pgdata/:cached
      - ./deploy/postgresql.conf:/etc/postgresql/postgresql.conf
    ports:
      - "5432:5432"

  app:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    command: uvicorn src.main:app --workers 1 --host 0.0.0.0
    volumes:
      - .:/sources:cached
      - /tmp/url-shortener-3000:/tmp
    depends_on:
      - postgres
    ports:
      - 8080:8000
    env_file: .env

volumes:
  postgres:
